name: Remote core and companions
on:
  push:
    branches: [main]
    paths: ['src/**', 'web/**', 'companions/**', 'deploy/**', 'scripts/**', 'native/**', 'packaging/**', 'pyproject.toml', 'uv.lock', '.github/workflows/remote-companions.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: remote-${{ github.ref }}
  cancel-in-progress: true
jobs:
  server:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: { persist-credentials: false }
      - run: docker build --target core -f deploy/Dockerfile -t jarvis-remote-core:dev .
      - run: docker build --target document-worker -f deploy/Dockerfile -t jarvis-document-worker:dev .
      - run: docker build -f deploy/Proxy.Dockerfile -t jarvis-proxy:dev .
      - run: python3 scripts/smoke-remote.py
      - run: JARVIS_PUBLIC_HOST=jarvis.invalid docker compose -f deploy/compose.yaml config --quiet
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      LANGSMITH_TRACING: 'false'
      LANGCHAIN_TRACING_V2: 'false'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: { persist-credentials: false }
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: { python-version: '3.12' }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: { node-version: '22' }
      - run: python -m pip install uv==0.13.5
      - run: uv sync --locked --extra build
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npm ci --no-audit --no-fund
        working-directory: companions
      - run: npm test
        working-directory: companions
      - run: uv run --no-sync python scripts/build-executor.py
      - run: uv run --no-sync python scripts/build-native-helper.py
      - run: npm run build:desktop
        working-directory: companions
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Jarvis-Companion-${{ matrix.os }}-unsigned
          path: |
            dist/companions/*.dmg
            dist/companions/*.zip
            dist/companions/*.exe
          if-no-files-found: error
          retention-days: 14
  mobile:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: { persist-credentials: false }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: { node-version: '22' }
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npm ci --no-audit --no-fund
        working-directory: companions
      - run: npm run sync
        working-directory: companions
      - if: runner.os == 'Linux'
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" >/dev/null
          ./gradlew assembleDebug lintDebug
        working-directory: companions/android
      - if: runner.os == 'macOS'
        run: xcodebuild -project companions/ios/App/App.xcodeproj -scheme App -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/ios CODE_SIGNING_ALLOWED=NO build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Jarvis-Mobile-${{ matrix.os }}-development
          path: |
            companions/android/app/build/outputs/apk/debug/*.apk
            build/ios/Build/Products/Debug-iphonesimulator/App.app
          if-no-files-found: error
          retention-days: 14
