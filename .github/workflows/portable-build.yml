name: Portable builds
on:
  push:
    branches: [main]
    paths: ['src/**', 'web/**', 'tests/**', 'scripts/**', 'packaging/**', 'pyproject.toml', 'uv.lock', '.github/workflows/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: portable-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: Linux-x86_64
          - os: windows-2022
            label: Windows-x86_64
          - os: macos-14
            label: macOS-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      UV_NO_PROGRESS: '1'
      LANGSMITH_TRACING: 'false'
      LANGCHAIN_TRACING_V2: 'false'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install uv==0.13.5
      - run: uv sync --locked --extra dev --extra build
      - run: uv run --no-sync ruff check src tests scripts/build-desktop.py scripts/smoke-desktop.py
      - run: uv run --no-sync pytest -q
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npm run build
        working-directory: web
      - if: runner.os == 'macOS'
        run: scripts/test-native.sh
      - if: runner.os != 'macOS'
        run: uv run --no-sync python scripts/build-desktop.py --skip-web
      - if: runner.os != 'macOS'
        run: uv run --no-sync python scripts/smoke-desktop.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: runner.os != 'macOS'
        with:
          name: Jarvis-${{ matrix.label }}
          path: dist/releases/*
          if-no-files-found: error
          retention-days: 14
