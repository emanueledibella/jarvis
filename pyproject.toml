[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "jarvis-personal"
version = "0.1.0"
description = "Personal macOS assistant with agents, voice, MCP tools, and verifiable memory."
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "pydantic-settings==2.16.1",
  "httpx>=0.28,<1",
  "aiosqlite==0.22.1",
  "deepagents==0.7.32",
  "langchain-openai==1.7.2",
  "openai[realtime]==3.37.0",
  "langchain-ollama==1.1.0",
  "langchain-anthropic==1.7.6",
  "langgraph-checkpoint-sqlite==3.1.2",
  "fastmcp==4.1.3",
  "apscheduler==3.11.3",
  "twilio==9.12.0",
  "dateparser>=1.2,<2",
  "croniter>=6,<7",
  "beautifulsoup4>=4.13,<5",
  "jsonschema>=4.25,<5",
  "python-multipart>=0.0.20,<1",
  "numpy>=2,<3",
  "icalendar>=6,<8",
  "recurring-ical-events==3.8.2",
]

[project.optional-dependencies]
voice = ["faster-whisper==1.2.1"]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.17.2"]

[project.scripts]
jarvis = "jarvis.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501", "ASYNC109"] # These timeout arguments are enforced with asyncio.timeout/wait_for.
